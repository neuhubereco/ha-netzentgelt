# Example dashboard with charts for an ENGLISH Home Assistant installation — needs the
# HACS card “apexcharts-card” (HACS → Frontend → “apexcharts-card”, written for v2.2.x).
# German installation: use examples/dashboard-apexcharts.yaml instead.
#
# Entity IDs are created from the device name and the entity name in the system language
# at setup time. The IDs below are those of an English installation with the device name
# “Netzentgelt” (see README, “English summary”). English entity IDs contributed by
# @babajun12 (issue #3).
#
# Paste: Dashboard → Edit → ⋮ → “Raw configuration editor” (whole dashboard), or only the
# cards under `cards:` into an existing dashboard.
#
# Notes on the card:
# * The colour thresholds (`color_threshold`) are fixed numbers — the card cannot read entity
#   values there. They are set for a target of 10 kW (green < 9, yellow up to 10, red above).
#   For another target adjust both values, e.g. target 9.5 kW → 8.5 and 9.5. The target LINE
#   always follows the “Target power” slider.
# * `data_generator` builds the columns from the integration's attributes (no recorder
#   needed — those lists are deliberately not recorded).
# * Layout: view of type “sections”; charts span the full width (`column_span`), the height
#   is fixed via `apex_config.chart.height`.
# * `EVAL:` expressions in `apex_config` are evaluated when the page loads; if the dashboard
#   stays open past midnight, reload once.
title: Grid capacity charge
views:
  - title: Charts
    path: netzentgelt-charts
    icon: mdi:chart-bar
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # --- Forecast of the current quarter-hour (core card, easy to read) ---
          - type: gauge
            name: Forecast current quarter-hour
            entity: sensor.netzentgelt_15_minute_forecast
            unit: kW
            min: 0
            max: 20
            needle: true
            severity:
              green: 0
              yellow: 9     # target − 1 (for a 10 kW target)
              red: 10       # tier limit / target
            grid_options:
              columns: full
          # --- Settings: target via slider, enable switch for automations ---
          - type: entities
            title: Peak shaving
            entities:
              - entity: switch.netzentgelt_peak_shaving_active
                name: Peak shaving active
              - entity: number.netzentgelt_target_power
                name: Target (15-min average)
              - entity: sensor.netzentgelt_headroom
                name: Headroom to target
              - entity: binary_sensor.netzentgelt_peak_imminent
                name: Peak imminent
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: entities
            title: This month
            entities:
              - entity: sensor.netzentgelt_monthly_peak
                name: Monthly peak
              - type: attribute
                entity: sensor.netzentgelt_monthly_peak
                attribute: peak_quarter_start
                name: reached
                time_format: datetime
              - entity: sensor.netzentgelt_billed_power
                name: Billed power
              - entity: sensor.netzentgelt_capacity_charge_month_estimate
                name: Capacity charge (estimate)
              - entity: sensor.netzentgelt_load_profile
                name: Peak at
              - entity: sensor.netzentgelt_tariff_window
                name: Tariff window
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: entities
            title: Tariff (indicative)
            entities:
              - entity: number.netzentgelt_capacity_price_tier_1
                name: Price up to tier limit
              - entity: number.netzentgelt_capacity_price_tier_2
                name: Price above
              - entity: number.netzentgelt_tier_limit
                name: Tier limit
              - entity: number.netzentgelt_agreed_capacity
                name: Agreed capacity
            grid_options:
              columns: full
      - type: grid
        column_span: 3
        cards:
          # --- (i) Today: 96 quarter-hours, target, tier limit, monthly peak ---
          # DST change: graph_span is a fixed duration (24 h from midnight).
          # On the last Sunday in October (25-hour day) the window ends at 23:00 — the
          # columns 23:00–23:45 are then missing from the chart (the values themselves are
          # complete in the attribute today_kw); on the last Sunday in March (23-hour day)
          # one empty hour remains at the end. If you mind: graph_span: 25h (at the cost of
          # one empty hour after midnight on all other days).
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: Today – quarter-hours
              show_states: true
              colorize_states: true
            experimental:
              color_threshold: true
            yaxis:
              - min: 0
                max: ~12
                decimals: 1
            apex_config:
              chart:
                height: 320
              tooltip:
                x:
                  format: HH:mm
            series:
              - entity: sensor.netzentgelt_load_profile
                name: Quarter-hour
                type: column
                unit: kW
                float_precision: 2
                show:
                  in_header: false
                  legend_value: false
                # Colour per column: green < target − 1, yellow up to target, red above (for a 10 kW target)
                color_threshold:
                  - value: 0
                    color: "#43a047"
                  - value: 9
                    color: "#fbc02d"
                  - value: 10
                    color: "#e53935"
                # Slot i = quarter-hour starting i × 15 min after midnight (wall-clock time,
                # so days with a DST change are correct); null = missing/invalid.
                data_generator: |
                  const values = entity.attributes.today_kw || [];
                  const day = moment().startOf('day');
                  return values.map((kw, slot) => [
                    day.clone().hours(Math.floor(slot / 4)).minutes((slot % 4) * 15).valueOf(),
                    kw,
                  ]);
              # Optional: your own house consumption as a comparison line. Only grid
              # import (the columns) counts for the capacity peak — PV and the home
              # battery then show up as the gap between line and columns, which
              # answers the question “why is the forecast so low?” by itself.
              # Replace the entity with your own consumption sensor; 5-minute
              # statistics, because their means are time-weighted (the raw history
              # would not be).
              # - entity: sensor.house_consumption_power
              #   name: House consumption
              #   type: line
              #   curve: smooth
              #   stroke_width: 2
              #   color: "#ab47bc"
              #   unit: kW
              #   float_precision: 2
              #   statistics:
              #     type: mean
              #     period: 5minute
              #   show:
              #     legend_value: false
              - entity: sensor.netzentgelt_load_profile
                name: Yesterday
                type: area
                curve: stepline
                stroke_width: 1
                opacity: 0.18
                color: "#90a4ae"
                unit: kW
                float_precision: 2
                show:
                  legend_value: false
                # Missing quarter-hours are left out here instead of being returned as null:
                # the header shows the last point of the series, which would otherwise
                # read “N/A” when the 23:45 measurement is missing.
                data_generator: |
                  const values = entity.attributes.yesterday_kw || [];
                  const day = moment().startOf('day');
                  return values
                    .map((kw, slot) => [
                      day.clone().hours(Math.floor(slot / 4)).minutes((slot % 4) * 15).valueOf(),
                      kw,
                    ])
                    .filter(([, kw]) => Number.isFinite(kw));
              - entity: number.netzentgelt_target_power
                name: Target
                type: line
                curve: stepline
                stroke_width: 2
                stroke_dash: 6
                color: "#1e88e5"
                unit: kW
                float_precision: 1
                data_generator: |
                  const kw = Number(entity.state);
                  return Number.isFinite(kw) ? [[start.getTime(), kw], [end.getTime(), kw]] : [];
              - entity: number.netzentgelt_tier_limit
                name: Tier limit
                type: line
                curve: stepline
                stroke_width: 1
                stroke_dash: 2
                color: "#757575"
                unit: kW
                float_precision: 1
                data_generator: |
                  const kw = Number(entity.state);
                  return Number.isFinite(kw) ? [[start.getTime(), kw], [end.getTime(), kw]] : [];
              - entity: sensor.netzentgelt_monthly_peak
                name: Monthly peak
                type: line
                curve: stepline
                stroke_width: 2
                color: "#8e24aa"
                unit: kW
                float_precision: 2
                data_generator: |
                  const kw = Number(entity.state);
                  return Number.isFinite(kw) ? [[start.getTime(), kw], [end.getTime(), kw]] : [];
            grid_options:
              columns: full
      - type: grid
        column_span: 3
        cards:
          # --- (ii) When do your peaks occur? Monthly profile over the day ---
          # Columns: highest quarter-hour per time of day this month, line: average.
          # Bands: tariff windows per the draft regulation — SNAP 10:00–16:00 only applies
          # 1 Apr–30 Sep, WiNAP 22:00–04:00 only 1 Oct–31 Mar. For simplicity both are
          # always drawn (fixed times of the current day).
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: When do your peaks occur? (this month)
            yaxis:
              - min: 0
                decimals: 1
            apex_config:
              chart:
                height: 320
              tooltip:
                x:
                  format: HH:mm
              annotations:
                xaxis:
                  - x: "EVAL:new Date().setHours(10, 0, 0, 0)"
                    x2: "EVAL:new Date().setHours(16, 0, 0, 0)"
                    fillColor: "#fdd835"
                    opacity: 0.15
                    label:
                      text: SNAP (Apr–Sep)
                      borderColor: "#fbc02d"
                  - x: "EVAL:new Date().setHours(0, 0, 0, 0)"
                    x2: "EVAL:new Date().setHours(4, 0, 0, 0)"
                    fillColor: "#5c6bc0"
                    opacity: 0.15
                    label:
                      text: WiNAP (Oct–Mar)
                      borderColor: "#5c6bc0"
                  - x: "EVAL:new Date().setHours(22, 0, 0, 0)"
                    x2: "EVAL:new Date().setHours(24, 0, 0, 0)"
                    fillColor: "#5c6bc0"
                    opacity: 0.15
                    label:
                      text: WiNAP
                      borderColor: "#5c6bc0"
            series:
              - entity: sensor.netzentgelt_load_profile
                name: Highest quarter-hour
                show:
                  legend_value: false
                type: column
                color: "#e53935"
                opacity: 0.8
                unit: kW
                float_precision: 2
                data_generator: |
                  const values = entity.attributes.month_max_kw || [];
                  const day = moment().startOf('day');
                  return values.map((kw, slot) => [
                    day.clone().hours(Math.floor(slot / 4)).minutes((slot % 4) * 15).valueOf(),
                    kw,
                  ]);
              - entity: sensor.netzentgelt_load_profile
                name: Average
                show:
                  legend_value: false
                type: line
                curve: smooth
                stroke_width: 2
                color: "#1e88e5"
                unit: kW
                float_precision: 2
                extend_to: false
                data_generator: |
                  const values = entity.attributes.month_avg_kw || [];
                  const day = moment().startOf('day');
                  return values.map((kw, slot) => [
                    day.clone().hours(Math.floor(slot / 4)).minutes((slot % 4) * 15).valueOf(),
                    kw,
                  ]);
              - entity: number.netzentgelt_target_power
                name: Target
                type: line
                curve: stepline
                stroke_width: 2
                stroke_dash: 6
                color: "#43a047"
                unit: kW
                float_precision: 1
                data_generator: |
                  const kw = Number(entity.state);
                  return Number.isFinite(kw) ? [[start.getTime(), kw], [end.getTime(), kw]] : [];
            grid_options:
              columns: full
      - type: grid
        column_span: 3
        cards:
          # --- (iii) Monthly peaks of the last 36 months + capacity charge ---
          # Columns green up to 10 kW (tier 1), red above (tier 2; 10 kW is the tier limit
          # for grid level 7 set in the draft). Line: estimated capacity charge per month,
          # calculated with the CURRENT price settings.
          # Imported months (portal export) appear the same way.
          # Little data? Shorten graph_span, e.g. to 365d.
          - type: custom:apexcharts-card
            graph_span: 1096d
            span:
              end: month
            header:
              show: true
              title: Monthly peaks and capacity charge
            experimental:
              color_threshold: true
            yaxis:
              - id: kw
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: kW
              - id: eur
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: € / month
            apex_config:
              chart:
                height: 320
              tooltip:
                x:
                  format: MMM yyyy
            series:
              - entity: sensor.netzentgelt_monthly_peak
                name: Monthly peak
                type: column
                yaxis_id: kw
                unit: kW
                float_precision: 2
                show:
                  in_header: false
                  legend_value: false
                color_threshold:
                  - value: 0
                    color: "#43a047"
                  - value: 10
                    color: "#e53935"
                data_generator: |
                  const history = entity.attributes.history || {};
                  return Object.keys(history).sort().map((month) => [
                    moment(month + '-15', 'YYYY-MM-DD').valueOf(),
                    history[month].peak_kw,
                  ]);
              - entity: sensor.netzentgelt_monthly_peak
                name: Capacity charge
                type: line
                curve: straight
                stroke_width: 2
                color: "#8e24aa"
                yaxis_id: eur
                unit: €
                float_precision: 2
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const history = entity.attributes.history || {};
                  return Object.keys(history).sort().map((month) => [
                    moment(month + '-15', 'YYYY-MM-DD').valueOf(),
                    history[month].capacity_cost_eur,
                  ]);
            grid_options:
              columns: full

      # --- (iv) Daily peaks: highest quarter-hour per day (long-term statistics) ---
      - type: grid
        column_span: 3
        cards:
          # --- Daily peaks: highest quarter-hour per day (from long-term statistics) ---
          - type: custom:apexcharts-card
            graph_span: 60d
            span:
              end: day
            header:
              show: true
              title: Daily peaks (60 days)
              show_states: true
              colorize_states: true
            experimental:
              color_threshold: true
            apex_config:
              chart:
                height: 300
              tooltip:
                x:
                  format: dd MMM
            yaxis:
              - min: 0
                decimals: 1
            series:
              - entity: sensor.netzentgelt_15_minute_power
                name: Highest quarter-hour
                type: column
                unit: kW
                float_precision: 2
                statistics:
                  type: max
                  period: day
                color_threshold:
                  - value: 0
                    color: "#43a047"
                  - value: 9
                    color: "#fbc02d"
                  - value: 10
                    color: "#e53935"
              - entity: number.netzentgelt_target_power
                name: Target
                type: line
                curve: stepline
                stroke_width: 2
                stroke_dash: 6
                color: "#1e88e5"
                unit: kW
                float_precision: 1
                show:
                  legend_value: false
                data_generator: |
                  const kw = Number(entity.state);
                  return Number.isFinite(kw) ? [[start.getTime(), kw], [end.getTime(), kw]] : [];
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          # --- Yearly values: highest quarter-hour per year + capacity charge (sum of months) ---
          - type: custom:apexcharts-card
            graph_span: 1096d
            span:
              end: year
            header:
              show: true
              title: Yearly values (current year pro rata)
            apex_config:
              chart:
                height: 300
              tooltip:
                x:
                  format: yyyy
            yaxis:
              - id: kw
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: kW
              - id: eur
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: € / Jahr
            series:
              - entity: sensor.netzentgelt_monthly_peak
                name: Highest quarter-hour
                type: column
                yaxis_id: kw
                unit: kW
                float_precision: 2
                color: "#e53935"
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const history = entity.attributes.history || {};
                  const years = {};
                  Object.keys(history).forEach((month) => {
                    const year = month.slice(0, 4);
                    const peak = history[month].peak_kw;
                    if (peak == null) return;
                    years[year] = Math.max(years[year] || 0, peak);
                  });
                  return Object.keys(years).sort().map((year) => [
                    moment(year + '-07-01').valueOf(), years[year],
                  ]);
              - entity: sensor.netzentgelt_monthly_peak
                name: Capacity charge (sum of months)
                type: column
                yaxis_id: eur
                unit: €
                float_precision: 0
                color: "#8e24aa"
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const history = entity.attributes.history || {};
                  const years = {};
                  Object.keys(history).forEach((month) => {
                    const year = month.slice(0, 4);
                    const cost = history[month].capacity_cost_eur;
                    if (cost == null) return;
                    years[year] = (years[year] || 0) + cost;
                  });
                  return Object.keys(years).sort().map((year) => [
                    moment(year + '-07-01').valueOf(), Math.round(years[year]),
                  ]);
            grid_options:
              columns: full
