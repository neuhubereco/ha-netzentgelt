[project]
name = "ha-netzentgelt"
version = "0.1.0"
description = "Home-Assistant-Integration: Netzentgelt AT (Leistungspreis, 15-Minuten-Spitze, SNAP/WiNAP)"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Typografie (– × „“) ist gewollt

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
